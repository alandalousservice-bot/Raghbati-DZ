<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>مساعد الرغبات</title>
<link rel="stylesheet" href="desktop.css">
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-rank" viewBox="0 0 24 24"><rect x="3.5" y="13" width="4" height="7" rx="1" fill="currentColor"/><rect x="10" y="9" width="4" height="11" rx="1" fill="currentColor"/><rect x="16.5" y="5" width="4" height="15" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3.2c1.3 0 2.5.7 3.2 1.8l5.2 8.4c.7 1.1 1.9 1.8 3.2 1.8H21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 6h3.2c1.3 0 2.5.7 3.2 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 18h3.2c1.3 0 2.5-.7 3.2-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18.5 3.8 21 6l-2.5 2.2M18.5 20.2 21 18l-2.5-2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.5v15l14-7.5-14-7.5Z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24"><path d="M10 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12H3m0 0 3.5-3.5M3 12l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header>
  <div class="brand">
    <img class="seal" src="icons/icon48.png" alt="">
    <h1>مساعد الرغبات</h1>
  </div>
  <div><button id="login"><svg class="icon"><use href="#i-login"/></svg>فتح المنصة وتسجيل الدخول</button><button id="activationLogout" hidden>إعادة التحقق / تسجيل الخروج</button></div>
</header>

<div class="layout">
  <aside>
    <h2><svg class="icon"><use href="#i-rank"/></svg>إدارة الرغبات</h2>
    <p class="hint">يتم اعتماد بيانات الحساب والاختيارات مباشرة من منصة التوظيف.</p>

    <label>العدد المطلوب<input id="minimum" type="number" min="1"></label>
    <button id="load" class="primary"><svg class="icon"><use href="#i-download"/></svg>تحميل البلديات والمؤسسات</button>

    <label>اختر البلدية<select id="commune"></select></label>
    <div id="institutions" class="institution-list">اضغط تحميل البيانات</div>
    <button id="addPrimary" class="primary"><svg class="icon"><use href="#i-plus"/></svg>إضافة المؤسسات المحددة</button>
    <ol id="primaryList" class="chosen"></ol>
    <button id="primary" class="primary"><svg class="icon"><use href="#i-play"/></svg>تشغيل المؤسسات الرئيسية</button>

    <hr>

    <label>بلديات الإكمال<select id="extraCommunes" multiple size="6"></select></label>
    <select id="mode"><option value="manual">الإكمال من البلديات المحددة</option><option value="auto">اختيار تلقائي للبلديات والمؤسسات</option></select>
    <button id="random" class="primary"><svg class="icon"><use href="#i-shuffle"/></svg>توليد الإكمال</button>
    <button id="stop" class="secondary"><svg class="icon"><use href="#i-stop"/></svg>إيقاف</button>

    <div id="status" class="notice">تسجيل الدخول والحفظ والتأكيد يدوية.</div><div id="progressBox" hidden><div class="progress-meta"><span>تقدم الإكمال</span><span id="progressText">0%</span></div><div class="progress-track"><div id="progressBar"></div></div></div>
    <footer class="app-credit"><strong>Raghbati DZ</strong><span>الإصدار 0.1.0 · تطوير Beidha Dev</span></footer>
  </aside>
  <section class="browser">
    <webview id="platform" src="https://concours.onec.dz/" partition="persist:tawdif" allowpopups></webview>
  </section>
</div>
<script src="activation.js"></script><script src="desktop-controls.js"></script>
</body>
</html>
