<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>مساعد الرغبات</title><link rel="stylesheet" href="desktop.css"><body><header><h1>مساعد الرغبات</h1><button id="login">فتح المنصة وتسجيل الدخول</button></header><div class="layout"><aside><h2>إدارة الرغبات</h2><p class="hint">يتم اعتماد بيانات الحساب والاختيارات مباشرة من منصة التوظيف.</p><label>العدد المطلوب<input id="minimum" type="number" min="1"></label><button id="load" class="primary">تحميل البلديات والمؤسسات</button><label>اختر البلدية<select id="commune"></select></label><div id="institutions" class="institution-list">اضغط تحميل البيانات</div><button id="addPrimary" class="primary">إضافة المؤسسات المحددة</button><ol id="primaryList"></ol><button id="primary" class="primary">تشغيل المؤسسات الرئيسية</button><label>بلديات الإكمال<select id="extraCommunes" multiple size="6"></select></label><select id="mode"><option value="manual">الإكمال من البلديات المحددة</option><option value="auto">اختيار تلقائي للبلديات والمؤسسات</option></select><button id="random" class="primary">توليد الإكمال</button><button id="stop" class="secondary">إيقاف</button><div id="status" class="notice">تسجيل الدخول والحفظ والتأكيد يدوية.</div></aside><section class="browser"><webview id="platform" src="https://concours.onec.dz/" partition="persist:tawdif" allowpopups></webview></section></div><script src="desktop-controls.js"></script></body></html>
