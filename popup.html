<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>مساعد الرغبات</title><link rel="stylesheet" href="popup.css"><body><header><h1>مساعد الرغبات</h1><p>اختيار منظم — مراجعة يدوية</p></header><main><section class="card"><h2>تخصص الحساب</h2><div class="grid"><label>الطور<select id="level"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></label><label>المادة<select id="subject"><option>اللغة العربية</option><option>التربية البدنية والرياضية</option><option>اللغة الفرنسية</option><option>اللغة الإنجليزية</option></select></label><label>العدد المطلوب<input id="minimum" type="number" min="1"></label></div></section><section class="card"><h2>المؤسسات الرئيسية — بالترتيب</h2><label>البلدية<select id="commune"></select></label><div id="institutions" class="institution-list">اختر بلدية</div><button id="addPrimary" class="primary full">إضافة المحدد وترقيمه</button><ol id="primaryList" class="chosen"></ol><button id="runPrimary" class="primary full">تشغيل المؤسسات الرئيسية</button></section><section class="card"><h2>الإكمال العشوائي</h2><label>طريقة الإكمال<select id="fillMode"><option value="chosen">من البلديات التي أحددها</option><option value="auto">اختيار البلديات والمؤسسات تلقائياً</option></select></label><label>البلديات المسموحة / الأولوية<select id="extraCommunes" multiple size="5"></select></label><label class="check"><input id="random" type="checkbox" checked> اختيار المؤسسات عشوائياً</label><button id="runRandom" class="primary full">توليد الإكمال العشوائي</button></section><button id="stop" class="secondary full">إيقاف</button><div id="log" class="log">جاهز — لم تتم إضافة أي مؤسسة.</div><footer>الحفظ والتأكيد يدويان.</footer></main><script src="popup.js"></script></body></html>
