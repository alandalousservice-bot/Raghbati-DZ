<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محاكاة منصة الرغبات</title><style>body{font:16px Arial;max-width:1100px;margin:20px auto;background:#f4f7f8}header{background:#00a673;color:#fff;padding:18px;font-size:24px}section{background:#fff;margin:15px 0;padding:15px;border-radius:6px}select,input,button{padding:8px;margin:4px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:8px}button{cursor:pointer;border:0;border-radius:4px;background:#00a673;color:white}.chosen li{padding:8px;margin:5px;background:#e8f5ef;cursor:grab}.danger{background:#777}</style><header>محاكاة منصة توظيف الأساتذة — الرغبات</header><section><b>الرتبة:</b> أستاذ التعليم الابتدائي قسم أول　<b>المادة:</b> التربية البدنية والرياضية　<b>الحد الأدنى:</b> 10</section><section><h3>قائمة المناصب الشاغرة والقابلة للشغور</h3><label>البلدية: <select id="commune"><option>سطيف</option><option>العلمة</option><option>بيضاء برج</option></select></label><input id="search" placeholder="البحث..."><table class="etabs" id="etabs"><thead><tr><th>رمز المؤسسة</th><th>تسمية المؤسسة</th><th>البلدية</th><th>المناصب</th><th></th></tr></thead><tbody></tbody></table></section><section><h3>المؤسسات المختارة (اسحب للترتيب)</h3><ol id="chosen" class="chosen"></ol><button id="save" class="danger">حفظ الخيارات (تجريبي)</button><p id="status"></p></section><script>const data=[['19011001','مجاوري محمد','سطيف'],['19011002','العربي التبسي','سطيف'],['19011006','الشيخ عبده','سطيف'],['19011008','عمارجية عباس','العلمة'],['19011009','مدور علي','العلمة'],['19011010','عبد العزيز زياد','بيضاء برج'],['19011012','الحاج محمد بوبريمة','سطيف'],['19011014','بوبريمة مسعود','سطيف'],['19011018','قصاب البشير','العلمة'],['19011024','بوقصة عبد القادر','بيضاء برج']];const body=document.querySelector('#etabs tbody'),chosen=document.querySelector('#chosen');function render(){const q=document.querySelector('#search').value, c=document.querySelector('#commune').value;body.innerHTML='';data.filter(x=>(!c||x[2]===c)&&x[1].includes(q)).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>01</td><td><button id="btn_'+x[0]+'">إضافة</button></td>';tr.querySelector('button').onclick=()=>{const li=document.createElement('li');li.dataset.code=x[0];li.textContent=x[0]+' — '+x[1];li.draggable=true;li.ondragstart=e=>e.dataTransfer.setData('text/plain',x[0]);chosen.append(li);tr.remove();document.querySelector('#save').disabled=false}})}document.querySelector('#commune').onchange=render;document.querySelector('#search').oninput=render;document.querySelector('#save').onclick=()=>document.querySelector('#status').textContent='تم الحفظ التجريبي محلياً فقط — لا توجد بيانات مرسلة.';render();</script></html>
